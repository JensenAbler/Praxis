# Location block for the praxis-apps.jensenabler.com server, installed as
# /etc/nginx/praxis-apps/claude-oauth-facade.conf. Routes the Claude OAuth
# facade's discovery, authorization, token, approval, and MCP endpoints to
# praxis-claude-facade.service on 127.0.0.1:8791.
location = /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /.well-known/openid-configuration { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /authorize { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /token { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /register { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location ^~ /interaction/ { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /mcp { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_http_version 1.1; }
location = /healthz { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location ^~ /auth/ { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location = /oauth/approve { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
