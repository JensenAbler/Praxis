# Install in /etc/nginx/conf.d/praxis-logging.conf (http context).
# No query strings, bodies, cookies, authorization, IPs, or user agents.
# The existing /etc/logrotate.d/nginx policy rotates *.log daily, retaining 14.
log_format praxis_minimal escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"praxis_request_id":"$upstream_http_x_praxis_request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"upstream_status":"$upstream_status","request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time"}';
