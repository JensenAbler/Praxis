# Include only in the existing HTTPS mcp.jensenabler.com server block.
# Paths stay qualified so Apocrypha's root routes and discovery are untouched.
location = /praxis {
    return 308 /praxis/;
}
location ^~ /praxis/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 30s;
    client_max_body_size 512k;
    access_log off;
}
location = /.well-known/oauth-protected-resource/praxis/mcp {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
location = /.well-known/oauth-authorization-server/praxis/oauth {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
location = /.well-known/openid-configuration/praxis/oauth {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# A changed OAuth issuer/resource requires reconnection. Never transparently
# replay an authenticated request addressed to the old resource at the new one.
location = /praxis-probe {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 410 '{"error":"endpoint_moved","endpoint":"https://mcp.jensenabler.com/praxis/mcp","message":"Reconnect Praxis using the new endpoint."}';
}
location ^~ /praxis-probe/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 410 '{"error":"endpoint_moved","endpoint":"https://mcp.jensenabler.com/praxis/mcp","message":"Reconnect Praxis using the new endpoint."}';
}
location = /.well-known/oauth-protected-resource/praxis-probe/mcp {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 410 '{"error":"endpoint_moved","endpoint":"https://mcp.jensenabler.com/praxis/mcp","message":"Reconnect Praxis using the new endpoint."}';
}
location = /.well-known/oauth-authorization-server/praxis-probe/oauth {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 410 '{"error":"endpoint_moved","endpoint":"https://mcp.jensenabler.com/praxis/mcp","message":"Reconnect Praxis using the new endpoint."}';
}
location = /.well-known/openid-configuration/praxis-probe/oauth {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 410 '{"error":"endpoint_moved","endpoint":"https://mcp.jensenabler.com/praxis/mcp","message":"Reconnect Praxis using the new endpoint."}';
}
